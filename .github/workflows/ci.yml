name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - name: Build all targets (chrome, firefox, safari)
        run: npm run build

      - run: npm run lint:firefox
