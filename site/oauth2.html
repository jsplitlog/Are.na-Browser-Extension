<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The authorization code arrives in this page's query string. no-referrer
         keeps it out of any Referer header, and the page loads no scripts, no
         fonts, and no external resources of any kind, so nothing can read it. -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <title>Signed in — Are.na Connections</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fff;
        color: #000;
      }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { margin: 0; color: #6b6b6b; font-size: 0.875rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #d3d3d3; }
        p { color: #999; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Return to Are.na Connections</h1>
      <p>
        Open the Are.na Connections extension again to finish signing in.
        On a Mac this tab usually closes by itself; on iPhone and iPad,
        reopening the extension completes sign-in and closes it for you.
      </p>
    </main>
  </body>
</html>
